<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigsight — Drilling Rig Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13; --bg-1:#0e131a; --bg-2:#131a23; --bg-3:#1a232e; --bg-4:#22303d;
  --line:rgba(148,163,184,.10); --line-2:rgba(148,163,184,.18); --line-3:rgba(148,163,184,.30);
  --text:#e9eef4; --text-2:#a4b1c0; --text-3:#6f7f91; --text-4:#4d5b6b;
  --accent:#22d3ee; --accent-2:#67e8f9; --accent-3:#0891b2;
  --accent-soft:rgba(34,211,238,.12); --accent-ring:rgba(34,211,238,.45); --accent-glow:rgba(34,211,238,.28);
  --warn:#f5b323; --warn-soft:rgba(245,179,35,.14); --ok:#34d399; --danger:#f87171;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-w:400px; --insp-w:460px; --r-sm:8px; --r:12px; --r-lg:16px;
  --glass:rgba(10,14,19,.72); --glass-line:rgba(148,163,184,.16);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -12px rgba(0,0,0,.6);
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit}
a{color:var(--accent-2)}
::selection{background:var(--accent-soft);color:var(--text)}
kbd{font-family:var(--mono);font-size:10.5px;line-height:1;padding:3px 6px 2px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--bg-3);color:var(--text-2);vertical-align:middle;letter-spacing:.02em}
*{scrollbar-width:thin;scrollbar-color:var(--bg-4) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:padding-box}
.app{display:grid;grid-template-columns:var(--nav-w) 1fr var(--insp-w);height:100%;width:100%;transition:grid-template-columns .3s var(--ease)}
.app.nav-off{grid-template-columns:0 1fr var(--insp-w)}
.app.insp-off{grid-template-columns:var(--nav-w) 1fr 0}
.app.nav-off.insp-off,.app.full{grid-template-columns:0 1fr 0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:500}

/* ---------- Navigator ---------- */
.nav{background:linear-gradient(180deg,var(--bg-1),var(--bg) 40%);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.nav::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;background:radial-gradient(60% 100% at 30% 0%,rgba(34,211,238,.10),transparent 70%);pointer-events:none}
.nav-head{padding:20px 20px 6px;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;color:#041016;background:linear-gradient(145deg,var(--accent-2),var(--accent) 55%,var(--accent-3));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px -8px var(--accent-glow)}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1;color:var(--text)}
.brand-name b{font-weight:800;color:var(--accent-2)}
.brand-tag{display:block;margin-top:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.nav-sub{display:none}
.collapse-btn{position:absolute;right:16px;top:22px;color:var(--text-3);width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center}
.collapse-btn:hover,.icon-btn:hover{background:var(--bg-3);color:var(--text)}
.search{margin:18px 20px 0;position:relative}
.search input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);border-radius:10px;padding:10px 40px 10px 38px;outline:none;font-size:14px;transition:border-color .18s,box-shadow .18s,background .18s}
.search input::placeholder{color:var(--text-3)}
.search input:hover{border-color:var(--line-3)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--bg-1)}
.search svg{position:absolute;left:12px;top:12px;color:var(--text-3);width:17px;height:17px;pointer-events:none}
.search::after{content:"/";position:absolute;right:11px;top:9px;font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;pointer-events:none}
.nav-title{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--text-3);font-weight:500;text-transform:uppercase}
.nav-title button{color:var(--text-3);font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500;padding:3px 8px;border-radius:6px}
.nav-title button:hover{color:var(--text);background:var(--bg-3)}
.tree{flex:1;overflow:auto;padding:2px 12px 12px 12px}
.sys{margin:2px 0;border-radius:var(--r);border:1px solid transparent;transition:border-color .18s,background .18s}
.sys-row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--r);cursor:pointer;position:relative;transition:background .18s var(--ease)}
.sys-row:hover{background:var(--bg-2)}
.sys.selected{background:var(--bg-2);border-color:var(--line-2)}
.sys.selected>.sys-row{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.sys.selected>.sys-row::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.sys-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border:1px solid var(--line-2);display:grid;place-items:center;color:var(--accent-2);flex:none;box-shadow:0 1px 0 rgba(255,255,255,.04) inset;transition:border-color .18s,box-shadow .18s,color .18s}
.sys-icon svg{width:22px;height:22px;fill:currentColor;display:block}
.sys-row:hover .sys-icon{border-color:var(--line-3)}
.sys.selected>.sys-row .sys-icon{border-color:var(--accent-ring);box-shadow:0 0 0 3px var(--accent-soft),0 1px 0 rgba(255,255,255,.04) inset;color:var(--accent-2)}
.sys-txt{flex:1;min-width:0}
.sys-name{font-weight:600;font-size:15px;letter-spacing:-.1px;color:var(--text)}
.sys-meta{color:var(--text-3);font-size:12px;margin-top:1px;font-family:var(--mono);letter-spacing:.01em}
.sys-chev{color:var(--text-4);transition:transform .22s var(--ease),color .18s;width:16px;height:16px;flex:none}
.sys-row:hover .sys-chev{color:var(--text-2)}
.sys.open>.sys-row .sys-chev{transform:rotate(90deg)}
.kids{display:none;padding:2px 0 8px 14px;border-left:1px solid var(--line-2);margin:0 0 4px 30px}
.sys.open>.kids{display:block}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 8px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13.5px;position:relative;transition:background .15s,color .15s}
.row:hover{background:var(--bg-2);color:var(--text)}
.row.selected{background:var(--accent-soft);color:var(--text)}
.row.selected::before{content:"";position:absolute;left:-15px;top:7px;bottom:7px;width:2px;background:var(--accent);border-radius:2px}
.row .chev{width:14px;color:var(--text-4);font-size:11px;transition:transform .2s var(--ease);flex:none;text-align:center}
.node.open>.row .chev{transform:rotate(90deg)}
.node>.kids2{display:none;padding-left:12px;border-left:1px solid var(--line);margin-left:14px}
.node.open>.kids2{display:block}
.row .no3d{margin-left:auto;font-size:9.5px;color:var(--text-4);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.nav-foot{padding:12px 20px 18px;border-top:1px solid var(--line);background:var(--bg-1)}
.rig-card{display:flex;gap:12px;align-items:center;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.rig-card .sys-icon{width:38px;height:38px;border-radius:9px}
.rig-card .sys-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.rig-card b{display:block;font-size:14px;font-weight:600}
.rig-card span{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.01em}
.foot-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.foot-btns button{padding:9px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line-2);font-weight:500;font-size:13px;color:var(--text-2)}
.foot-btns button:hover{border-color:var(--line-3);background:var(--bg-3);color:var(--text)}
.search-results{padding:6px 12px;flex:1;overflow:auto}
.search-results .row{font-size:13.5px;display:block;padding:7px 10px}
.search-results .path{display:block;font-size:11px;color:var(--text-3);margin:1px 0 0 0;font-family:var(--mono)}
.empty{color:var(--text-3);padding:24px 20px;font-size:13px}

/* ---------- Viewport ---------- */
.view{position:relative;min-width:0;background:linear-gradient(#2b5d9c 0%,#4f86c9 22%,#8fb6df 46%,#b9a07a 60%,#b9a07a 100%);overflow:hidden}
.view::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(6,10,15,.45);z-index:2}
canvas{display:block;width:100%;height:100%;outline:none;position:relative;z-index:1}
.glass{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 12px 32px -14px rgba(0,0,0,.7)}
.chips{position:absolute;top:14px;right:16px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-weight:500;font-size:12.5px;color:var(--text-2);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 24px -12px rgba(0,0,0,.7);cursor:pointer}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;transition:background .18s,box-shadow .18s}
.chip:hover{border-color:var(--line-3);color:var(--text)}
.chip.active{border-color:var(--accent-ring);background:rgba(34,211,238,.14);color:var(--text)}
.chip.active i{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.toolbar{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 40px -16px rgba(0,0,0,.8);z-index:3;white-space:nowrap}
.toolbar button{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-weight:500;font-size:13px;color:var(--text-2)}
.toolbar button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.toolbar button.active{background:var(--accent-soft);color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-ring) inset}
.toolbar button.active kbd{border-color:var(--accent-ring);color:var(--accent-2);background:transparent}
.toolbar button:disabled{opacity:.32;cursor:default}
.toolbar button:disabled:hover{background:none;color:var(--text-2)}
.toolbar .sep{width:1px;background:var(--line-2);margin:6px 6px}
.caption{position:absolute;left:0;right:0;bottom:0;padding:9px 20px;background:linear-gradient(180deg,rgba(10,14,19,.0),rgba(10,14,19,.85) 40%);color:var(--text);font-size:13.5px;font-weight:500;z-index:3;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.caption span{color:var(--text-3);font-size:11.5px;font-family:var(--mono);letter-spacing:.01em}
.tip{position:absolute;pointer-events:none;background:var(--glass);border:1px solid var(--glass-line);border-radius:8px;padding:5px 10px;font-size:12.5px;z-index:4;display:none;white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px -10px rgba(0,0,0,.7);font-weight:500}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,#111a24,var(--bg) 70%);z-index:10;color:var(--text-2);transition:opacity .55s var(--ease),visibility .55s}
.loading.done{opacity:0;visibility:hidden;pointer-events:none}
.loading-inner{display:flex;flex-direction:column;align-items:center;gap:10px;transform:translateY(-6%)}
.loading-anim{width:180px;height:180px;filter:drop-shadow(0 20px 40px rgba(34,211,238,.18))}
.loading-brand{font-size:28px;font-weight:800;letter-spacing:-.6px;color:var(--text)}
.loading-brand b{color:var(--accent-2);font-weight:800}
.loading-sub{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.loading-bar{width:180px;height:2px;border-radius:2px;background:var(--bg-4);overflow:hidden;margin-top:8px;position:relative}
.loading-bar::after{content:"";position:absolute;inset:0;width:45%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.4s var(--ease) infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(320%)}}
.panel-reveal{position:absolute;top:14px;z-index:3;width:36px;height:36px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;place-items:center;color:var(--text-2);box-shadow:0 8px 24px -12px rgba(0,0,0,.7)}
.panel-reveal:hover{color:var(--text);border-color:var(--line-3)}
.panel-reveal.left{left:14px}.panel-reveal.right{right:14px}
.app.nav-off .panel-reveal.left,.app.insp-off .panel-reveal.right{display:grid}
.app.full .panel-reveal{display:none}
.mode-badge{position:absolute;top:14px;left:16px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.app.nav-off .mode-badge{left:60px}
.badge{padding:5px 10px 5px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font-size:11.5px;font-weight:500;color:var(--warn);display:none;align-items:center;gap:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);letter-spacing:.01em}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.badge.on{display:inline-flex}

/* ---------- Inspector ---------- */
.insp{background:linear-gradient(180deg,var(--bg-1),var(--bg) 40%);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.insp-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px;border-bottom:1px solid var(--line)}
.insp-head h3{margin:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--text-3);font-weight:500;text-transform:uppercase}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-3)}
.insp-body{flex:1;overflow:auto;padding:20px 22px 48px}
.insp-empty{text-align:center;padding:110px 24px 0;color:var(--text-2);max-width:340px;margin:0 auto}
.insp-empty .cube{width:72px;height:72px;border-radius:18px;background:linear-gradient(180deg,var(--bg-3),var(--bg-2));border:1px solid var(--line-2);display:grid;place-items:center;margin:0 auto 22px;color:var(--accent-2);box-shadow:0 0 0 6px var(--bg-1),0 0 0 7px var(--line),0 24px 48px -20px var(--accent-glow)}
.insp-empty h2{color:var(--text);font-size:18px;margin:0 0 8px;font-weight:600;letter-spacing:-.2px}
.insp-empty p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text-3)}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-3);font-size:12.5px;font-family:var(--mono)}
.crumb .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 8px var(--accent-glow)}
.crumb .actions{margin-left:auto;display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line-2);color:var(--text);background:var(--bg-2)}
.btn:hover{border-color:var(--line-3);background:var(--bg-3)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:transparent;color:#041016;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -8px var(--accent-glow)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 26px -8px var(--accent-glow)}
.btn.primary kbd{background:rgba(0,0,0,.18);border-color:transparent;color:#041016}
.insp h1{font-size:24px;margin:14px 0 8px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.pills{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid rgba(245,179,35,.4);background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:12px;cursor:help;letter-spacing:.01em}
.pill i{width:14px;height:14px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:9px;font-style:normal;font-family:var(--mono)}
.abbr{font-family:var(--mono);color:var(--text-3);font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:2px 7px}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:7px;border:1px solid transparent;font-weight:500;font-size:13px;color:var(--text-2)}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg-4);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px -2px rgba(0,0,0,.6)}
.lead{font-size:16px;font-weight:600;line-height:1.45;margin:2px 0 12px;color:var(--text);letter-spacing:-.15px}
.para{color:var(--text-2);font-size:14px;line-height:1.65;margin:0 0 14px}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--accent-2);font-weight:500;cursor:pointer;margin-bottom:22px;font-size:13.5px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:500;margin:22px 0 10px}
.kv{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin-bottom:22px;background:var(--bg-1)}
.kv div{display:grid;grid-template-columns:140px 1fr;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.kv div:first-child{border-top:0}
.kv div:nth-child(even){background:rgba(255,255,255,.015)}
.kv div span:first-child{color:var(--text-3);font-size:12.5px}
.kv div span:last-child{color:var(--text);font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.callout{border:1px solid rgba(245,179,35,.25);border-left:3px solid var(--warn);border-radius:var(--r);padding:12px 14px;color:var(--text);font-size:13.5px;line-height:1.55;background:linear-gradient(90deg,var(--warn-soft),transparent 60%)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start;background:var(--bg-1);transition:border-color .18s,background .18s,transform .18s var(--ease)}
.list li.clickable{cursor:pointer;color:var(--text)}
.list li.clickable:hover{border-color:var(--accent-ring);background:var(--bg-2);transform:translateX(2px)}
.list .tag{font-family:var(--mono);font-size:11px;color:var(--accent-2);background:var(--accent-soft);padding:2px 7px;border-radius:5px;flex:none;margin-top:2px;letter-spacing:.01em}
.sev{width:7px;height:7px;border-radius:50%;flex:none;margin-top:8px}
.sev.hi{background:var(--danger);box-shadow:0 0 8px rgba(248,113,113,.6)}.sev.md{background:var(--warn);box-shadow:0 0 8px rgba(245,179,35,.5)}.sev.lo{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.5)}
.muted{color:var(--text-3);font-size:12.5px}

/* ---------- Site switcher ---------- */
.site-bar{display:flex;gap:6px;margin:10px 20px 0;position:relative}
.site-chain{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--text-2);font-size:12.5px;font-weight:500;flex:none}
.site-chain svg{width:15px;height:15px}
.site-chain:hover{color:var(--text);border-color:var(--line-3)}
.site-chain.active{color:var(--accent-2);border-color:var(--accent-ring);background:var(--accent-soft)}
.site-cur{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg-2);text-align:left}
.site-cur:hover{border-color:var(--line-3)}
.site-stage{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);background:var(--accent-soft);padding:2px 6px;border-radius:4px;flex:none}
.site-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:var(--text)}
.site-cur>svg{width:14px;height:14px;color:var(--text-3);flex:none}
.site-menu{position:absolute;left:0;right:0;top:40px;z-index:20;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:6px;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 24px 48px -20px rgba(0,0,0,.9);max-height:60vh;overflow:auto;animation:pop .18s var(--ease)}
.site-group{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 4px}
.site-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;color:var(--text-2)}
.site-item:hover{background:var(--bg-3);color:var(--text)}
.site-item.active{background:var(--accent-soft);color:var(--text)}
.site-item:disabled{opacity:.5;cursor:default}
.site-item:disabled:hover{background:none}
.site-item-icon{width:30px;height:30px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--accent-2);flex:none}
.site-item-icon svg{width:16px;height:16px;fill:currentColor}
.site-item>span:nth-child(2){flex:1;min-width:0}
.site-item b{display:block;font-size:13px;font-weight:600}
.site-item small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-item em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;flex:none}
.pill.roadmap{color:var(--text-2);border-color:var(--line-3);background:var(--bg-3)}
.rig-card .sys-icon svg{fill:currentColor;stroke:none}

/* ---------- Modals ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(4,7,11,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:50}
.modal-bg.open{display:grid}
.modal{width:min(720px,92vw);max-height:84vh;overflow:auto;background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border:1px solid var(--line-2);border-radius:var(--r-lg);padding:26px 28px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 40px 80px -30px rgba(0,0,0,.9);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.3px}
.modal .sub{color:var(--text-3);margin-bottom:20px;font-size:13.5px}
.modal h4{margin:20px 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:500}
.modal p{margin:6px 0;color:var(--text-2);font-size:13.5px}
.modal .close{float:right;color:var(--text-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;margin:-6px -8px 0 0}
.modal .close:hover{background:var(--bg-3);color:var(--text)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:var(--bg-1);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px;font-family:var(--mono);color:var(--accent-2)}
.stat span{color:var(--text-3);font-size:12px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:var(--text-2);font-size:13.5px}
.chk b{color:var(--text);font-weight:500}
.chk .r{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-3)}
@media (max-width:1100px){:root{--nav-w:340px;--insp-w:380px}}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav,.insp{display:none}.app.nav-off .panel-reveal.left,.panel-reveal{display:grid}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const descendants=id=>{const out=[id];(NODES[id].children||[]).forEach(c=>out.push(...descendants(c.id)));return out;};
const countOf=id=>descendants(id).length-1;
const typeOf=n=>n.level===0?'system':n.children?'assembly':'component';

/* ================================================================

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:10,far:400});sun.shadow.bias=-0.0006;scene.add(sun);

const rig=new THREE.Group();scene.add(rig);         // selectable equipment

let MESHES=[],NODE_MESH={};
const C={white:0xe8ebee,red:0xc8332a,yellow:0xe6b422,blue:0x2f4a78,steel:0x9aa3ad,dark:0x2b2f38,navy:0x1a2a4a,cream:0xd9cfb0,concrete:0x8a8478,cable:0x1b1b1b,sand:0xc8ab7c,rock:0x8f7a68};
function mat(color,o={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.7,metalness:.15},o));}
function reg(m,nodeId,extra){m.castShadow=true;m.receiveShadow=true;m.userData.nodeId=nodeId;Object.assign(m.userData,extra||{});m.userData.baseOpacity=m.material.opacity;if(nodeId){(NODE_MESH[nodeId]=NODE_MESH[nodeId]||[]).push(m);MESHES.push(m);rig.add(m);}else world.add(m);return m;}
function box(w,h,d,color,x,y,z,nodeId,extra,mo){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,mo));m.position.set(x,y,z);return reg(m,nodeId,extra);}
function cyl(r,h,color,x,y,z,nodeId,extra,mo,rt,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt==null?r:rt,r,h,seg||20),mat(color,mo));m.position.set(x,y,z);return reg(m,nodeId,extra);}
function strut(a,b,r,color,nodeId,extra){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b);const len=A.distanceTo(B);const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat(color,{roughness:.55,metalness:.3}));m.position.copy(A).lerp(B,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());return reg(m,nodeId,extra);}
function pipe(pts,r,color,nodeId,extra){for(let i=0;i<pts.length-1;i++)strut(pts[i],pts[i+1],r,color,nodeId,extra);}

function clearGroup(g){while(g.children.length){const m=g.children.pop();if(m.geometry)m.geometry.dispose();if(m.material)(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.dispose());}}
function sph(r,color,x,y,z,nodeId,extra,mo){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat(color,mo));m.position.set(x,y,z);return reg(m,nodeId,extra);}
// process column: shell + concrete skirt + ring platforms + ladder + vent
function tower(r,h,color,x,z,nodeId,o={}){const base=o.base||0,sk=o.skirt===false?0:Math.min(3,h*.08);
  if(sk)cyl(r*1.12,sk,C.concrete,x,base+sk/2,z,nodeId,null,{roughness:.95});
  cyl(r,h,color,x,base+sk+h/2,z,nodeId,null,{metalness:.35,roughness:.5});
  const n=o.platforms==null?Math.max(1,Math.round(h/9)):o.platforms;for(let i=1;i<=n;i++){const y=base+sk+h*i/(n+1);cyl(r+.9,.14,C.steel,x,y,z,nodeId,null,{metalness:.5,roughness:.4},r+.9,24);}
  strut([x+r+.3,base+sk+1,z],[x+r+.3,base+sk+h-.5,z],.07,C.steel,nodeId);cyl(r*.22,1.4,C.steel,x,base+sk+h+.7,z,nodeId);}
function buildWorld(variant){clearGroup(world);const seed=s=>{let x=Math.sin(s*9999)*10000;return x-Math.floor(x);};
  const groundCol=variant==='flat'?0x8f8c84:C.sand;
  const g=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),mat(groundCol,{roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;g.userData.ground=true;g.userData.baseOpacity=1;world.add(g);
  const scrub=mat(0x6e7b3a,{roughness:1});
  if(variant==='desert'){
    const road=new THREE.Mesh(new THREE.PlaneGeometry(6,300),mat(0xbea27a,{roughness:1}));road.rotation.x=-Math.PI/2;road.rotation.z=.25;road.position.set(70,.02,-120);road.userData.ground=true;road.userData.baseOpacity=1;world.add(road);
    for(let i=0;i<220;i++){const a=seed(i)*Math.PI*2,d=70+seed(i+.3)*260;const m=new THREE.Mesh(new THREE.SphereGeometry(.6+seed(i+.7)*.9,6,5),scrub);m.position.set(Math.cos(a)*d,.4,Math.sin(a)*d);m.scale.y=.6;m.castShadow=true;m.userData.baseOpacity=1;world.add(m);}
    for(let ring=0;ring<2;ring++)for(let i=0;i<46;i++){const a=(i/46)*Math.PI*2+ring*.07;const d=(ring?520:400)+seed(i*3+ring)*70;const h=(ring?150:80)+seed(i*7+ring)*(ring?120:70);
      const m=new THREE.Mesh(new THREE.ConeGeometry(h*(0.9+seed(i)*0.6),h,7),mat(ring?0x7c7a80:C.rock,{roughness:1,flatShading:true}));m.position.set(Math.cos(a)*d,h/2-6,Math.sin(a)*d);m.rotation.y=seed(i+9)*3;m.userData.baseOpacity=1;world.add(m);}
  }else if(variant==='flat'){
    const apron=new THREE.Mesh(new THREE.PlaneGeometry(260,200),mat(0x7d7a73,{roughness:1}));apron.rotation.x=-Math.PI/2;apron.position.y=.01;apron.userData.ground=true;apron.userData.baseOpacity=1;world.add(apron);
    const road=new THREE.Mesh(new THREE.PlaneGeometry(8,600),mat(0x5f5c57,{roughness:1}));road.rotation.x=-Math.PI/2;road.position.set(-150,.02,0);road.userData.ground=true;road.userData.baseOpacity=1;world.add(road);
    for(let i=0;i<120;i++){const a=seed(i)*Math.PI*2,d=190+seed(i+.3)*300;const m=new THREE.Mesh(new THREE.SphereGeometry(.7+seed(i+.7)*1.2,6,5),scrub);m.position.set(Math.cos(a)*d,.4,Math.sin(a)*d);m.scale.y=.5;m.userData.baseOpacity=1;world.add(m);}
    for(let i=0;i<30;i++){const a=(i/30)*Math.PI*2;const d=560+seed(i*3)*90;const h=30+seed(i*7)*40;const m=new THREE.Mesh(new THREE.ConeGeometry(h*2.2,h,7),mat(0x8a8785,{roughness:1,flatShading:true}));m.position.set(Math.cos(a)*d,h/2-4,Math.sin(a)*d);m.userData.baseOpacity=1;world.add(m);}
  }else if(variant==='coast'){
    const sea=new THREE.Mesh(new THREE.PlaneGeometry(1400,700),mat(0x2c6a86,{roughness:.25,metalness:.15}));sea.rotation.x=-Math.PI/2;sea.position.set(0,.05,420);sea.userData.ground=true;sea.userData.baseOpacity=1;world.add(sea);
    const beach=new THREE.Mesh(new THREE.PlaneGeometry(1400,14),mat(0xd8c49a,{roughness:1}));beach.rotation.x=-Math.PI/2;beach.position.set(0,.03,72);beach.userData.ground=true;beach.userData.baseOpacity=1;world.add(beach);
    for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(1.2+seed(i)*1.6,0),mat(0x6d6a66,{roughness:1,flatShading:true}));m.position.set(-120+seed(i+.2)*240,.6,76+seed(i+.5)*4);m.rotation.set(seed(i)*3,seed(i+1)*3,0);m.userData.baseOpacity=1;world.add(m);}
    for(let i=0;i<90;i++){const a=Math.PI+seed(i)*Math.PI,d=150+seed(i+.3)*260;const m=new THREE.Mesh(new THREE.SphereGeometry(.7+seed(i+.7)*1,6,5),scrub);m.position.set(Math.cos(a)*d,.4,Math.sin(a)*d);m.scale.y=.5;m.userData.baseOpacity=1;world.add(m);}
    for(let i=0;i<22;i++){const a=Math.PI*1.1+(i/22)*Math.PI*.8;const d=480+seed(i*3)*80;const h=50+seed(i*7)*60;const m=new THREE.Mesh(new THREE.ConeGeometry(h*1.6,h,7),mat(C.rock,{roughness:1,flatShading:true}));m.position.set(Math.cos(a)*d,h/2-5,Math.sin(a)*d);m.userData.baseOpacity=1;world.add(m);}
  }
}

/* ---- camera controls (custom orbit) ---- */
const cam={target:new THREE.Vector3(0,14,0),theta:.55,phi:1.12,radius:120};
// HOME is set per site by loadSite()
function applyCam(){const{target,theta,phi,radius}=cam;camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}
let drag=null,spaceDown=false;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.focus();drag={x:e.clientX,y:e.clientY,btn:e.button,pan:e.button===2||spaceDown,moved:0};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);tween=null;
  if(drag.pan){const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);const k=cam.radius*0.0016;cam.target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);}
  else{cam.theta-=dx*.006;cam.phi=Math.min(1.55,Math.max(.08,cam.phi-dy*.006));}applyCam();}
  else hover(e);});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<4&&drag.btn===0)pick(e);drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();tween=null;const f=Math.exp(e.deltaY*.0012);const r=new THREE.Raycaster();r.setFromCamera(ndc(e),camera);const p=r.ray.at(cam.radius,new THREE.Vector3());cam.target.lerp(p,1-f);cam.radius=Math.min(600,Math.max(2.5,cam.radius*f));applyCam();},{passive:false});
canvas.addEventListener('dblclick',e=>{const h=rayHit(e);if(h){select(h.userData.nodeId);focusOn(h.userData.nodeId);}});
function ndc(e){const r=canvas.getBoundingClientRect();return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);}
let tween=null;
function flyTo(target,theta,phi,radius){tween={t0:performance.now(),dur:700,from:{target:cam.target.clone(),theta:cam.theta,phi:cam.phi,radius:cam.radius},to:{target,theta,phi,radius}};}
function stepTween(now){if(!tween)return;let k=Math.min(1,(now-tween.t0)/tween.dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;const f=tween.from,t=tween.to;cam.target.copy(f.target).lerp(t.target,k);cam.theta=f.theta+(t.theta-f.theta)*k;cam.phi=f.phi+(t.phi-f.phi)*k;cam.radius=f.radius+(t.radius-f.radius)*k;applyCam();if(k>=1)tween=null;}
function focusOn(id){const ids=descendants(id);const bb=new THREE.Box3();let any=false;ids.forEach(i=>(NODE_MESH[i]||[]).forEach(m=>{if(m.visible){bb.expandByObject(m);any=true;}}));if(!any)return;const c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3());const d=Math.max(6,Math.max(s.x,s.y,s.z)*.5/Math.tan(camera.fov*Math.PI/360)*1.35+Math.min(s.x,s.z)*.3);
  const phi=c.y<0?1.45:cam.phi;flyTo(c,cam.theta,phi,d);}
function resetView(){flyTo(new THREE.Vector3(...HOME.target),HOME.theta,HOME.phi,HOME.radius);}

/* ---- picking & hover ---- */
const ray=new THREE.Raycaster();const tip=document.getElementById('tip');let hovered=null;
function rayHit(e){ray.setFromCamera(ndc(e),camera);const hits=ray.intersectObjects(MESHES,false);for(const h of hits){const m=h.object;if(m.visible&&m.material.opacity>.3)return m;}return null;}
function hover(e){const m=rayHit(e);const id=m?m.userData.nodeId:null;if(id!==hovered){hovered=id;canvas.style.cursor=id?'pointer':'default';}if(id){const r=canvas.getBoundingClientRect();tip.style.display='block';tip.style.left=(e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+14)+'px';tip.textContent=NODES[id].name;}else tip.style.display='none';}
function pick(e){const m=rayHit(e);if(m)select(m.userData.nodeId);else if(state.mode==='none')select(null);}

/* ================================================================
   STATE & VISUAL RULES
   ================================================================ */
const state={selected:null,mode:'none',hidden:new Set(),internals:false,subsurface:false,tab:'Overview'};
const accent=new THREE.Color(0x22d3ee);
function applyVisual(){const sel=state.selected?new Set(descendants(state.selected)):null;const hid=new Set();state.hidden.forEach(h=>descendants(h).forEach(i=>hid.add(i)));
  MESHES.forEach(m=>{const id=m.userData.nodeId;const inSel=sel&&sel.has(id);const isSub=m.position.y<0;
    let vis=!hid.has(id);if(state.mode==='isolate'&&!inSel)vis=false;if(isSub&&!state.subsurface)vis=false;m.visible=vis;
    let op=m.userData.baseOpacity;if(state.mode==='fade'&&!inSel)op=Math.min(op,.12);if(state.internals&&m.userData.shell)op=Math.min(op,.14);
    m.material.opacity=op;m.material.transparent=op<1;m.material.depthWrite=op>.5;
    m.material.emissive=inSel?accent:new THREE.Color(0);m.material.emissiveIntensity=inSel?.45:0;});
  world.children.forEach(m=>{if(m.userData.ground){const op=state.subsurface?.18:1;m.material.opacity=op;m.material.transparent=op<1;m.material.depthWrite=op>.5;}});
  sub.visible=state.subsurface;
  const on=(id,v)=>document.getElementById(id).classList.toggle('on',!!v);
  on('bIso',state.mode==='isolate');on('bFade',state.mode==='fade');on('bInt',state.internals);on('bSub',state.subsurface);
  const bh=document.getElementById('bHid');bh.textContent=state.hidden.size?`${state.hidden.size} hidden · U to unhide`:'';on('bHid',state.hidden.size);
  document.querySelectorAll('#toolbar button').forEach(b=>{const a=b.dataset.act;if(['focus','isolate','fade','hide'].includes(a))b.disabled=!state.selected;b.classList.toggle('active',(a==='isolate'&&state.mode==='isolate')||(a==='fade'&&state.mode==='fade')||(a==='internals'&&state.internals)||(a==='subsurface'&&state.subsurface));});
}
function select(id){state.selected=id;renderTreeSelection();renderChips();renderInspector();applyVisual();document.getElementById('caption').textContent=id?NODES[id].name:SITE.name;writeHash(false);}
function act(a){switch(a){
  case 'focus':if(state.selected)focusOn(state.selected);break;
  case 'isolate':if(state.selected)state.mode=state.mode==='isolate'?'none':'isolate';break;
  case 'fade':if(state.selected)state.mode=state.mode==='fade'?'none':'fade';break;
  case 'hide':if(state.selected){state.hidden.add(state.selected);const s=state.selected;state.selected=null;renderTreeSelection();renderChips();renderInspector();document.getElementById('caption').textContent=SITE.name;}break;
  case 'unhide':state.hidden.clear();break;
  case 'internals':state.internals=!state.internals;break;
  case 'subsurface':if(!SITE.hasSubsurface)break;state.subsurface=!state.subsurface;if(state.subsurface)flyTo(new THREE.Vector3(HOME.target[0],-22,HOME.target[2]),cam.theta,1.35,150);else resetView();break;
  case 'reset':state.mode='none';state.hidden.clear();state.internals=false;state.subsurface=false;select(null);resetView();break;
  case 'esc':if(state.mode!=='none')state.mode='none';else if(state.subsurface||state.internals){state.subsurface=false;state.internals=false;resetView();}else select(null);break;
}applyVisual();}
document.getElementById('toolbar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.act);});

const treeEl=document.getElementById('tree');const open=new Set();
function renderTree(){treeEl.innerHTML='';SYSTEMS.forEach(s=>{const n3=descendants(s.id).filter(i=>NODE_MESH[i]).length;const el=document.createElement('div');el.className='sys';el.dataset.id=s.id;
  el.innerHTML=`<div class="sys-row" data-id="${s.id}"><div class="sys-icon">${ICONS[s.icon]}</div><div class="sys-txt"><div class="sys-name">${s.name}</div><div class="sys-meta">${s.code} · ${countOf(s.id)} components · ${n3} in 3D</div></div><svg class="sys-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div><div class="kids"></div>`;
  const kids=el.querySelector('.kids');(s.children||[]).forEach(c=>kids.appendChild(nodeEl(c)));treeEl.appendChild(el);});renderTreeSelection();}
function nodeEl(n){const d=document.createElement('div');d.className='node';d.dataset.id=n.id;const has=!!n.children;d.innerHTML=`<div class="row" data-id="${n.id}"><span class="chev">${has?'❯':''}</span><span>${n.name}</span>${NODE_MESH[n.id]||has?'':'<span class="no3d">no 3D</span>'}</div>`;if(has){const k=document.createElement('div');k.className='kids2';n.children.forEach(c=>k.appendChild(nodeEl(c)));d.appendChild(k);}return d;}
function renderTreeSelection(){treeEl.querySelectorAll('.sys,.node').forEach(e=>{const id=e.dataset.id;e.classList.toggle('open',open.has(id));const r=e.querySelector(':scope>.sys-row,:scope>.row');if(r)r.classList.toggle('selected',id===state.selected);});
  if(state.selected){const el=treeEl.querySelector(`[data-id="${CSS.escape(state.selected)}"].sys,[data-id="${CSS.escape(state.selected)}"].node`);if(el)el.scrollIntoView({block:'nearest'});}}
treeEl.addEventListener('click',e=>{const chev=e.target.closest('.chev,.sys-chev');const row=e.target.closest('.sys-row,.row');if(!row)return;const id=row.dataset.id;const has=NODES[id].children;
  if(chev&&has){open.has(id)?open.delete(id):open.add(id);renderTreeSelection();return;}
  if(has&&state.selected===id){open.has(id)?open.delete(id):open.add(id);}else if(has)open.add(id);
  select(id);if(!has||NODES[id].level>0)focusOn(id);});
document.getElementById('collapseAll').onclick=()=>{open.clear();renderTreeSelection();};
// search
const searchEl=document.getElementById('search');let resultsEl=null;
searchEl.addEventListener('input',()=>{const q=searchEl.value.trim().toLowerCase();if(resultsEl){resultsEl.remove();resultsEl=null;}treeEl.style.display=q?'none':'';if(!q)return;
  const hits=ORDER.filter(id=>{const n=NODES[id];return n.name.toLowerCase().includes(q)||id.toLowerCase().includes(q)||(n.level===0&&n.code.includes(q));}).slice(0,40);
  resultsEl=document.createElement('div');resultsEl.className='search-results';resultsEl.innerHTML=hits.length?hits.map(id=>{const path=[];let p=PARENT[id];while(p){path.unshift(NODES[p].name);p=PARENT[p];}return `<div class="row" data-id="${id}"><span class="chev"></span><span>${NODES[id].name}</span><span class="no3d">${id}</span></div><span class="path">${path.join(' / ')||typeOf(NODES[id])}</span>`;}).join(''):'<div class="empty">No equipment matches. Try a system code such as HS or a component name.</div>';
  resultsEl.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id;let p=PARENT[id];while(p){open.add(p);p=PARENT[p];}select(id);focusOn(id);});
  treeEl.parentNode.insertBefore(resultsEl,treeEl);});

// chips
function renderChips(){const c=document.getElementById('chips');const sys=state.selected?NODES[state.selected].system:null;c.innerHTML=SYSTEMS.map(s=>`<button class="chip ${s.id===sys?'active':''}" data-id="${s.id}">${s.id}<i></i></button>`).join('');}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;open.add(b.dataset.id);select(b.dataset.id);focusOn(b.dataset.id);});

const inspBody=document.getElementById('inspBody');
function renderInspector(){const id=state.selected;if(!id){inspBody.innerHTML=`<div class="insp-empty"><div class="cube"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></div><h2>Select a component</h2><p>Click equipment in the 3D view or choose it in the navigator. Hovering shows its name; clicking opens its engineering details here.</p></div>`;return;}
  const n=NODES[id],sys=NODES[n.system];const tabs=['Overview','Engineering','Connections','Safety','Specs','Evidence'];
  const parentName=n.parent?NODES[n.parent].name:null;
  const summary=n.summary||`${n.name} is part of the ${parentName} assembly in the ${sys.name} system.`;
  const body=n.body||(n.level===0?'':`Modelled as a ${typeOf(n)} of ${parentName}. ${n.summary?'':'Engineering description pending source review.'}`);
  const where=n.where||[['Area',sys.where?sys.where[0][1]:''],['Containing structure',parentName||SITE.name],['Placement',NODE_MESH[id]?'Located in the 3D scene; press F to frame it.':'No 3D geometry yet; listed for hierarchy completeness.']];
  const specs=n.specs||(n.parent&&NODES[n.parent].specs)||sys.specs;
  const conns=n.conns||sys.conns.filter(x=>x!==sys.id);
  const safety=n.safety||sys.safety;
  const why=n.why||sys.why;
  let content='';
  switch(state.tab){
    case 'Overview':content=`<p class="lead">${summary}</p>${body?`<p class="para">${body}</p>`:''}<span class="link" data-tab="Engineering">Read the full engineering description</span><div class="h4">Where it is</div><div class="kv">${where.map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join('')}</div><div class="h4">Why it matters</div><div class="callout">${why}</div>`;break;
    case 'Engineering':content=`<p class="lead">${summary}</p><p class="para">${body||sys.body}</p><p class="para">${n.eng||sys.eng}</p>${n.children?`<div class="h4">Sub-assemblies</div><ul class="list">${n.children.map(c=>`<li class="clickable" data-go="${c.id}"><span class="tag">${c.id.split('.').pop()}</span>${c.name}<span class="muted" style="margin-left:auto">${countOf(c.id)?countOf(c.id)+' parts':''}</span></li>`).join('')}</ul>`:''}`;break;
    case 'Connections':content=`<p class="para">Systems and assemblies this ${typeOf(n)} exchanges load, fluid, power or control with.</p><ul class="list">${conns.map(c=>`<li class="clickable" data-go="${c}"><span class="tag">${c}</span>${NODES[c].name}</li>`).join('')}${n.parent?`<li class="clickable" data-go="${n.parent}"><span class="tag">parent</span>${parentName}</li>`:''}</ul>`;break;
    case 'Safety':content=`<p class="para">Barriers, checks and hazards recorded against ${n.level===0?'this system':n.name}.</p><ul class="list">${safety.map((s,i)=>`<li><span class="sev ${['hi','md','lo','md'][i%4]}"></span>${s}</li>`).join('')}</ul>`;break;
    case 'Specs':content=`<div class="kv">${specs.map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join('')}</div><p class="muted">Values are representative and carry the Proposed status until verified against an OEM data sheet.</p>`;break;
    case 'Evidence':content=`<p class="para">Source references cited for this node. Bracketed tags in descriptions map to these.</p><ul class="list">${EVIDENCE.slice(0,3+(id.length%3)).map(e=>`<li><span class="tag">${e.slice(0,2)}</span>${e.slice(3)}</li>`).join('')}</ul>`;break;}
  inspBody.innerHTML=`<div class="crumb"><span class="dot"></span><span>${sys.name}</span><span>·</span><span>Level ${n.level}</span><span>·</span><span>${typeOf(n)}</span><div class="actions">${n.site&&SITE_BY_ID[n.site]?`<button class="btn primary" data-site="${n.site}">Enter site <span aria-hidden="true">→</span></button>`:''}<button class="btn ${n.site?'':'primary'}" data-act="focus">Focus <kbd>F</kbd></button><button class="btn" data-act="isolate">Isolate <kbd>I</kbd></button></div></div>
  <h1>${n.name}</h1>
  <div class="pills">${n.roadmap?'<span class="pill roadmap" title="Planned site. Not yet modelled.">Roadmap <i>i</i></span>':'<span class="pill" title="Demo data. Representative values, not verified against a specific asset.">Proposed <i>i</i></span>'}<span class="abbr">${n.level===0?n.id:id}</span></div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${t===state.tab?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>${content}`;}
inspBody.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;renderInspector();return;}const a=e.target.closest('[data-act]');if(a){act(a.dataset.act);return;}const st=e.target.closest('[data-site]');if(st){loadSite(st.dataset.site);return;}const g=e.target.closest('[data-go]');if(g){let p=PARENT[g.dataset.go];while(p){open.add(p);p=PARENT[p];}select(g.dataset.go);focusOn(g.dataset.go);}});

/* ---- site loading & routing ---- */
const helpers={box,cyl,strut,pipe,sph,tower,mat,reg,C,sub,world,rig,THREE};
function parseHash(){const m=location.hash.match(/^#\/([\w-]+)(?:\/([\w.-]+))?/);return m?{site:m[1],node:m[2]||null}:{site:null,node:null};}
function writeHash(push){const h='#/'+SITE.id+(state.selected?'/'+state.selected:'');if(location.hash===h)return;history[push?'pushState':'replaceState'](null,'',h);}
function loadSite(id,opts={}){const site=SITE_BY_ID[id]||SITE_BY_ID.chain||SITE_LIST[0];if(!site)return;const ld=document.getElementById('loading');const swap=!!SITE;if(swap)ld.classList.remove('done');
  SITE=site;SYSTEMS=site.systems;EVIDENCE=site.evidence||[];HOME=JSON.parse(JSON.stringify(site.home));indexSite(SYSTEMS);
  clearGroup(rig);clearGroup(sub);MESHES=[];NODE_MESH={};hovered=null;tip.style.display='none';
  buildWorld(site.world||'desert');site.build(helpers);sub.visible=false;
  state.selected=null;state.mode='none';state.hidden.clear();state.internals=false;state.subsurface=false;state.tab='Overview';open.clear();tween=null;
  if(searchEl.value){searchEl.value='';searchEl.dispatchEvent(new Event('input'));}
  document.querySelector('#toolbar [data-act="subsurface"]').hidden=!site.hasSubsurface;
  cam.target.set(...HOME.target);cam.theta=HOME.theta;cam.phi=HOME.phi;cam.radius=HOME.radius;applyCam();
  if(SYSTEMS[0])open.add(SYSTEMS[0].id);
  renderSiteUI();renderTree();renderChips();renderInspector();applyVisual();
  document.getElementById('caption').textContent=site.name;
  document.getElementById('captionRight').textContent=`${MESHES.length} meshes · ${ORDER.filter(i=>NODE_MESH[i]).length} nodes in 3D`;
  if(!opts.silent)writeHash(true);
  if(opts.node&&NODES[opts.node]){let p=PARENT[opts.node];while(p){open.add(p);p=PARENT[p];}select(opts.node);focusOn(opts.node);}
  if(swap)setTimeout(()=>ld.classList.add('done'),380);}
window.addEventListener('hashchange',()=>{const h=parseHash();if(h.site&&SITE_BY_ID[h.site]&&h.site!==SITE.id)loadSite(h.site,{silent:true,node:h.node});else if(h.node!==state.selected&&(!h.node||NODES[h.node])){select(h.node);if(h.node)focusOn(h.node);}});
function renderSiteUI(){const stage=STAGES.find(s=>s[0]===SITE.stage);document.getElementById('siteName').textContent=SITE.name;document.getElementById('siteStage').textContent=stage?stage[1]:'';
  document.getElementById('siteCardName').textContent=SITE.name;document.getElementById('siteCardIcon').innerHTML=ICONS[SITE.icon||'grid'];
  document.getElementById('rigStats').textContent=`${SYSTEMS.length} systems  ·  ${ORDER.length-SYSTEMS.length} components`;
  document.getElementById('btnChain').hidden=!SITE_BY_ID.chain;document.getElementById('btnChain').classList.toggle('active',SITE.id==='chain');
  const menu=document.getElementById('siteMenu');menu.innerHTML=STAGES.map(([k,label])=>{const items=SITE_LIST.filter(s=>s.stage===k);if(!items.length)return '';return `<div class="site-group">${label}</div>`+items.map(s=>`<button class="site-item ${s.id===SITE.id?'active':''}" data-site="${s.id}" ${s.roadmap?'disabled':''}><span class="site-item-icon">${ICONS[s.icon||'grid']}</span><span><b>${s.name}</b><small>${s.short||''}</small></span>${s.roadmap?'<em>Roadmap</em>':''}</button>`).join('');}).join('');}

document.getElementById('btnSite').onclick=e=>{e.stopPropagation();siteMenu.hidden=!siteMenu.hidden;};
