<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigsight — Drilling Rig Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1324; --bg-2:#121a30; --bg-3:#182140; --line:#232d4d; --line-2:#2f3a5f;
  --text:#e6eaf5; --text-2:#aab3cc; --text-3:#7a86a8;
  --accent:#8b5cf6; --accent-2:#c084fc; --accent-soft:rgba(139,92,246,.18);
  --warn:#f5c451; --ok:#3ecf8e; --danger:#f0655d;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-w:430px; --insp-w:470px; --radius:14px;
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
a{color:var(--accent-2)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg-3);color:var(--text-2);vertical-align:middle}
.app{display:grid;grid-template-columns:var(--nav-w) 1fr var(--insp-w);height:100%;width:100%;transition:grid-template-columns .25s ease}
.app.nav-off{grid-template-columns:0 1fr var(--insp-w)}
.app.insp-off{grid-template-columns:var(--nav-w) 1fr 0}
.app.nav-off.insp-off,.app.full{grid-template-columns:0 1fr 0}

/* ---------- Navigator ---------- */
.nav{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.nav-head{padding:18px 18px 8px;position:relative}
.brand{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#171c39,#141a33);padding:12px 40px 12px 44px;border-radius:12px}
.brand-name{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1}
.brand-name b{background:linear-gradient(90deg,#8b5cf6,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.nav-sub{color:var(--text-2);margin-top:12px;font-size:15px}
.collapse-btn{position:absolute;right:18px;top:26px;color:var(--text-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.collapse-btn:hover,.icon-btn:hover{background:var(--bg-3);color:var(--text)}
.search{margin:14px 18px 0;position:relative}
.search input{width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px 12px 42px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:14px;top:13px;color:var(--text-3)}
.nav-title{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 6px;font-size:13px;letter-spacing:.14em;color:#a78bfa;font-weight:600;text-transform:uppercase}
.nav-title button{color:var(--text-2);font-size:14px;letter-spacing:0;text-transform:none;font-weight:500}
.nav-title button:hover{color:var(--text)}
.tree{flex:1;overflow:auto;padding:4px 10px 12px 18px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sys{margin:8px 0;border-radius:var(--radius);border:1px solid transparent}
.sys-row{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:var(--radius);cursor:pointer;transition:background .15s}
.sys-row:hover{background:var(--bg-2)}
.sys.selected>.sys-row{background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(139,92,246,.10));border:1px solid rgba(139,92,246,.55)}
.sys-icon{width:50px;height:50px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line-2);display:grid;place-items:center;color:#a78bfa;flex:none}
.sys-icon svg{width:22px;height:22px}
.sys-txt{flex:1;min-width:0}
.sys-name{font-weight:700;font-size:18px}
.sys-meta{color:var(--text-2);font-size:14px;margin-top:2px}
.sys-chev{color:var(--text-2);transition:transform .2s}
.sys.open>.sys-row .sys-chev{transform:rotate(90deg)}
.kids{display:none;padding:2px 0 8px 22px;border-left:1px solid var(--line);margin-left:24px}
.sys.open>.kids{display:block}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--text-2);font-size:17px}
.row:hover{background:var(--bg-2);color:var(--text)}
.row.selected{background:var(--accent-soft);color:var(--text)}
.row .chev{width:16px;color:var(--text-3);font-size:12px;transition:transform .2s;flex:none}
.node.open>.row .chev{transform:rotate(90deg)}
.node>.kids2{display:none;padding-left:18px;border-left:1px solid var(--line);margin-left:16px}
.node.open>.kids2{display:block}
.row .no3d{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.nav-foot{padding:12px 18px 16px;border-top:1px solid var(--line)}
.rig-card{display:flex;gap:14px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rig-card .sys-icon{width:44px;height:44px}
.rig-card b{display:block;font-size:17px}
.rig-card span{font-family:var(--mono);font-size:13px;color:var(--text-2)}
.foot-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.foot-btns button{padding:12px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);font-weight:600;font-size:16px}
.foot-btns button:hover{border-color:var(--line-2);background:var(--bg-3)}
.search-results{padding:6px 18px;flex:1;overflow:auto}
.search-results .row{font-size:15px}
.search-results .path{display:block;font-size:12px;color:var(--text-3);margin-left:26px;margin-top:-4px}
.empty{color:var(--text-3);padding:20px 18px}

/* ---------- Viewport ---------- */
.view{position:relative;min-width:0;background:linear-gradient(#2f6fbf 0%,#5f9be0 22%,#9fc3ea 46%,#c9a97a 60%,#c9a97a 100%);overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:none}
.chips{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:3}
.chip{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(13,19,36,.86);border:1px solid var(--line-2);font-weight:700;font-size:15px;color:var(--text);backdrop-filter:blur(6px)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--text-2);display:inline-block}
.chip:hover{border-color:var(--accent)}
.chip.active{border-color:var(--accent);background:rgba(139,92,246,.35)}
.toolbar{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;gap:4px;padding:8px 12px;border-radius:14px;background:rgba(13,19,36,.88);border:1px solid var(--line-2);backdrop-filter:blur(8px);z-index:3;white-space:nowrap}
.toolbar button{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:16px}
.toolbar button:hover{background:var(--bg-3)}
.toolbar button.active{background:var(--accent-soft);color:#e9dcff}
.toolbar button:disabled{opacity:.35;cursor:default}
.toolbar .sep{width:1px;background:var(--line-2);margin:6px 6px}
.caption{position:absolute;left:0;right:0;bottom:0;padding:9px 22px;background:rgba(13,19,36,.92);color:var(--text);font-size:16px;z-index:3;display:flex;justify-content:space-between}
.caption span{color:var(--text-3);font-size:13px;font-family:var(--mono)}
.tip{position:absolute;pointer-events:none;background:rgba(13,19,36,.92);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;font-size:13px;z-index:4;display:none;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;color:var(--text-2);font-size:15px;transition:opacity .4s}
.loading.done{opacity:0;pointer-events:none}
.panel-reveal{position:absolute;top:14px;z-index:3;width:36px;height:36px;border-radius:10px;background:rgba(13,19,36,.86);border:1px solid var(--line-2);display:none;place-items:center;color:var(--text-2)}
.panel-reveal.left{left:14px}.panel-reveal.right{right:14px}
.app.nav-off .panel-reveal.left,.app.insp-off .panel-reveal.right{display:grid}
.app.nav-off .panel-reveal.right{right:14px}
.app.full .panel-reveal{display:none}
.mode-badge{position:absolute;top:14px;left:16px;z-index:3;display:flex;gap:8px}
.app.nav-off .mode-badge{left:60px}
.badge{padding:6px 12px;border-radius:999px;background:rgba(13,19,36,.86);border:1px solid var(--line-2);font-size:13px;color:var(--text-2);display:none}
.badge.on{display:block}

/* ---------- Inspector ---------- */
.insp{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.insp-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;border-bottom:1px solid var(--line)}
.insp-head h3{margin:0;font-size:13px;letter-spacing:.14em;color:#a78bfa;font-weight:600;text-transform:uppercase}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.insp-body{flex:1;overflow:auto;padding:18px 24px 40px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.insp-empty{text-align:center;padding:90px 20px 0;color:var(--text-2)}
.insp-empty .cube{width:74px;height:74px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line-2);display:grid;place-items:center;margin:0 auto 22px;color:#a78bfa}
.insp-empty h2{color:var(--text);font-size:22px;margin:0 0 12px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--text-2);font-size:15px}
.crumb .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-2);display:inline-block}
.crumb .actions{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line-2);color:var(--text)}
.btn.primary{background:linear-gradient(90deg,#7c3aed,#a855f7);border-color:transparent}
.btn.primary kbd{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.btn:hover{filter:brightness(1.12)}
.insp h1{font-size:28px;margin:14px 0 8px;font-weight:800;letter-spacing:-.3px}
.pills{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;border:1px solid #b8912a;color:var(--warn);font-weight:600;font-size:14px;cursor:help}
.pill i{width:15px;height:15px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:10px;font-style:normal}
.abbr{font-family:var(--mono);color:var(--text-2);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:8px 16px;border-radius:12px;border:1px solid var(--line-2);font-weight:600;font-size:15px;color:var(--text)}
.tab.active{border-color:var(--accent);background:var(--accent-soft)}
.lead{font-size:20px;font-weight:700;line-height:1.35;margin:4px 0 14px}
.para{color:var(--text-2);font-size:16px;line-height:1.55;margin:0 0 14px}
.link{display:inline-block;color:#a78bfa;font-weight:600;cursor:pointer;margin-bottom:22px}
.link:hover{text-decoration:underline}
.h4{font-weight:700;font-size:16px;margin:16px 0 10px}
.kv{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.kv div{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px}
.kv div:first-child{border-top:0}
.kv div span:first-child{color:var(--text-2)}
.kv div span:last-child{color:var(--text)}
.callout{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;line-height:1.5;background:var(--bg-2)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:15px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.list li.clickable{cursor:pointer;color:var(--text)}
.list li.clickable:hover{border-color:var(--accent)}
.list .tag{font-family:var(--mono);font-size:12px;color:#a78bfa;background:var(--accent-soft);padding:2px 7px;border-radius:6px;flex:none;margin-top:2px}
.sev{width:8px;height:8px;border-radius:50%;flex:none;margin-top:8px}
.sev.hi{background:var(--danger)}.sev.md{background:var(--warn)}.sev.lo{background:var(--ok)}
.muted{color:var(--text-3);font-size:13px}

/* ---------- Modals ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,18,.6);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50}
.modal-bg.open{display:grid}
.modal{width:min(720px,92vw);max-height:84vh;overflow:auto;background:var(--bg);border:1px solid var(--line-2);border-radius:18px;padding:26px 28px}
.modal h2{margin:0 0 6px;font-size:22px}
.modal .sub{color:var(--text-2);margin-bottom:18px}
.modal h4{margin:18px 0 8px;font-size:15px;color:var(--text)}
.modal p{margin:6px 0;color:var(--text-2)}
.modal .close{float:right;color:var(--text-2)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--text-2);font-size:13px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);color:var(--text-2)}
.chk b{color:var(--text);font-weight:600}
.chk .r{margin-left:auto;font-family:var(--mono);font-size:13px}
@media (max-width:1100px){:root{--nav-w:340px;--insp-w:380px}}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav,.insp{display:none}.app.nav-off .panel-reveal.left,.panel-reveal{display:grid}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ================= Navigator ================= -->
  <aside class="nav" id="nav">
    <div class="nav-head">
      <div class="brand"><span class="brand-name">Rig<b>sight</b></span></div>
      <button class="collapse-btn" id="navCollapse" title="Collapse navigator ([)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
      <div class="nav-sub">Drilling Rig Explorer</div>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search equipment, alias or ID…" autocomplete="off">
    </div>
    <div class="nav-title"><span>Systems</span><button id="collapseAll">Collapse all</button></div>
    <div class="tree" id="tree"></div>
    <div class="nav-foot">
      <div class="rig-card">
        <div class="sys-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg></div>
        <div><b>Drilling Rig</b><span id="rigStats"></span></div>
      </div>
      <div class="foot-btns"><button id="btnIntegrity">Integrity</button><button id="btnShortcuts">Shortcuts</button></div>
    </div>
  </aside>

  <!-- ================= Viewport ================= -->
  <main class="view" id="view">
    <div class="loading" id="loading">Loading rig…</div>
    <button class="panel-reveal left" id="navReveal" title="Show navigator ([)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="panel-reveal right" id="inspReveal" title="Show inspector (])"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="mode-badge">
      <span class="badge" id="bIso">Isolated</span><span class="badge" id="bFade">Others faded</span>
      <span class="badge" id="bInt">Internals</span><span class="badge" id="bSub">Subsurface</span><span class="badge" id="bHid"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toolbar" id="toolbar">
      <button data-act="focus" disabled>Focus <kbd>F</kbd></button>
      <button data-act="isolate" disabled>Isolate <kbd>I</kbd></button>
      <button data-act="fade" disabled>Fade others <kbd>D</kbd></button>
      <button data-act="hide" disabled>Hide <kbd>H</kbd></button>
      <button data-act="internals">Internals <kbd>X</kbd></button>
      <span class="sep"></span>
      <button data-act="subsurface">Subsurface <kbd>G</kbd></button>
      <button data-act="reset">Reset <kbd>R</kbd></button>
    </div>
    <div class="caption"><div id="caption">Drilling rig</div><span id="captionRight"></span></div>
    <div class="tip" id="tip"></div>
    <canvas id="c" tabindex="0"></canvas>
  </main>

  <!-- ================= Inspector ================= -->
  <aside class="insp" id="insp">
    <div class="insp-head"><h3>Inspector</h3>
      <button class="icon-btn" id="inspCollapse" title="Collapse inspector (])"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modalBox"></div></div>

<script src="vendor/three.min.js"></script>
<script>
/* ================================================================
   DATA: engineering hierarchy. Independent of the 3D scene graph.
   ================================================================ */
const SYSTEMS = [
 {id:'HS',code:'01',name:'Hoisting',icon:'hoist',
  summary:'Raises, lowers and suspends drill string, casing and tools using drawworks, drilling line, crown and traveling blocks, hook.',
  body:'Block-and-tackle: the drilling line runs from the drawworks drum (fast line) over the crown block at the mast top, down and up through the traveling-block and crown-block sheaves, and its far end (deadline) is clamped in the deadline anchor at floor level. Reeling the drum in raises the traveling block; gravity lowers it while the drum pays out under motor control. The disc brake holds the drum when stopped and stops it in an emergency.',
  eng:'SYSTEM 01 of the baseline land rig. Rated hook load is set by the derrick, the traveling equipment and the number of lines strung. With 12 lines the mechanical advantage is 12 and the fast-line load is roughly hook load divided by 12 plus sheave friction. Drum torque, brake capacity and line ton-mile tracking are the operating limits that matter day to day.',
  where:[['Area','Whole rig, ground level to crown'],['Containing structure','Rig (mast, substructure, drill floor)'],['Placement','From the supply reel at ground level to the crown at about +43 m; well centre is the vertical through the hook']],
  why:'Everything that goes in or out of the hole hangs from this system. A failure here is a dropped-string event.',
  specs:[['Rated hook load','500 t (1,100 kip)'],['Drawworks input','1,500 hp (1,120 kW)'],['Drilling line','1 3/8 in, 6x19 IWRC'],['Lines strung','12'],['Mast clear height','43 m (142 ft)'],['Brake','Dual disc, hydraulic + spring-applied park']],
  safety:['Line slip-and-cut on ton-mile schedule','Crown-saver and floor-saver limits set before each trip','Dropped-object inspection of crown and traveling equipment','Brake test after any drawworks maintenance'],
  conns:['RS','DS','SS','PS'],
  children:[
   {id:'HS.crown',name:'Crown Block',summary:'Fixed sheave cluster at the mast top that turns the drilling line down to the traveling block.',specs:[['Sheaves','7 x 1.5 m'],['Rating','500 t'],['Bearings','Sealed roller']],
     children:[{id:'HS.crown.sheaves',name:'Sheave cluster'},{id:'HS.crown.frame',name:'Crown frame'},{id:'HS.crown.fastline',name:'Fast-line sheave'},{id:'HS.crown.bumper',name:'Bumper blocks'},{id:'HS.crown.platform',name:'Crown platform & rails'}]},
   {id:'HS.anchor',name:'Deadline Anchor',summary:'Clamps the dead end of the drilling line and carries the weight-indicator sensor.',specs:[['Type','Drum, 1 3/8 in'],['Rating','Sensor 100 t line pull']],
     children:[{id:'HS.anchor.drum',name:'Anchor drum'},{id:'HS.anchor.sensor',name:'Weight indicator sensor'},{id:'HS.anchor.reel',name:'Supply reel'}]},

const NODES={}, PARENT={}, ORDER=[];
(function idx(list,parent,level){list.forEach(n=>{n.level=level;n.parent=parent;n.system=parent?NODES[parent].system:n.id;NODES[n.id]=n;PARENT[n.id]=parent;ORDER.push(n.id);if(n.children)idx(n.children,n.id,level+1);});})(SYSTEMS,null,0);
const descendants=id=>{const out=[id];(NODES[id].children||[]).forEach(c=>out.push(...descendants(c.id)));return out;};
const countOf=id=>descendants(id).length-1;

/* ---- camera controls (custom orbit) ---- */
const cam={target:new THREE.Vector3(0,14,0),theta:.55,phi:1.12,radius:120};
const HOME=JSON.parse(JSON.stringify({target:[0,14,0],theta:.55,phi:1.12,radius:120}));
function applyCam(){const{target,theta,phi,radius}=cam;camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);}
let drag=null,spaceDown=false;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{canvas.focus();drag={x:e.clientX,y:e.clientY,btn:e.button,pan:e.button===2||spaceDown,moved:0};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);tween=null;
  if(drag.pan){const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);const k=cam.radius*0.0016;cam.target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);}
  else{cam.theta-=dx*.006;cam.phi=Math.min(1.55,Math.max(.08,cam.phi-dy*.006));}applyCam();}
  else hover(e);});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<4&&drag.btn===0)pick(e);drag=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();tween=null;const f=Math.exp(e.deltaY*.0012);const r=new THREE.Raycaster();r.setFromCamera(ndc(e),camera);const p=r.ray.at(cam.radius,new THREE.Vector3());cam.target.lerp(p,1-f);cam.radius=Math.min(600,Math.max(2.5,cam.radius*f));applyCam();},{passive:false});
canvas.addEventListener('dblclick',e=>{const h=rayHit(e);if(h){select(h.userData.nodeId);focusOn(h.userData.nodeId);}});
function ndc(e){const r=canvas.getBoundingClientRect();return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);}
let tween=null;
function flyTo(target,theta,phi,radius){tween={t0:performance.now(),dur:700,from:{target:cam.target.clone(),theta:cam.theta,phi:cam.phi,radius:cam.radius},to:{target,theta,phi,radius}};}
function stepTween(now){if(!tween)return;let k=Math.min(1,(now-tween.t0)/tween.dur);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;const f=tween.from,t=tween.to;cam.target.copy(f.target).lerp(t.target,k);cam.theta=f.theta+(t.theta-f.theta)*k;cam.phi=f.phi+(t.phi-f.phi)*k;cam.radius=f.radius+(t.radius-f.radius)*k;applyCam();if(k>=1)tween=null;}
function focusOn(id){const ids=descendants(id);const bb=new THREE.Box3();let any=false;ids.forEach(i=>(NODE_MESH[i]||[]).forEach(m=>{if(m.visible){bb.expandByObject(m);any=true;}}));if(!any)return;const c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3());const d=Math.max(6,Math.max(s.x,s.y,s.z)*.5/Math.tan(camera.fov*Math.PI/360)*1.35+Math.min(s.x,s.z)*.3);
  const phi=c.y<0?1.45:cam.phi;flyTo(c,cam.theta,phi,d);}
function resetView(){flyTo(new THREE.Vector3(...HOME.target),HOME.theta,HOME.phi,HOME.radius);}

const ray=new THREE.Raycaster();const tip=document.getElementById('tip');let hovered=null;
function rayHit(e){ray.setFromCamera(ndc(e),camera);const hits=ray.intersectObjects(MESHES,false);for(const h of hits){const m=h.object;if(m.visible&&m.material.opacity>.3)return m;}return null;}
function hover(e){const m=rayHit(e);const id=m?m.userData.nodeId:null;if(id!==hovered){hovered=id;canvas.style.cursor=id?'pointer':'default';}if(id){const r=canvas.getBoundingClientRect();tip.style.display='block';tip.style.left=(e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+14)+'px';tip.textContent=NODES[id].name;}else tip.style.display='none';}

const state={selected:null,mode:'none',hidden:new Set(),internals:false,subsurface:false,tab:'Overview'};
const accent=new THREE.Color(0x8b5cf6);
function applyVisual(){const sel=state.selected?new Set(descendants(state.selected)):null;const hid=new Set();state.hidden.forEach(h=>descendants(h).forEach(i=>hid.add(i)));
  MESHES.forEach(m=>{const id=m.userData.nodeId;const inSel=sel&&sel.has(id);const isSub=m.position.y<0;
    let vis=!hid.has(id);if(state.mode==='isolate'&&!inSel)vis=false;if(isSub&&!state.subsurface)vis=false;m.visible=vis;
    let op=m.userData.baseOpacity;if(state.mode==='fade'&&!inSel)op=Math.min(op,.12);if(state.internals&&m.userData.shell)op=Math.min(op,.14);
    m.material.opacity=op;m.material.transparent=op<1;m.material.depthWrite=op>.5;
    m.material.emissive=inSel?accent:new THREE.Color(0);m.material.emissiveIntensity=inSel?.45:0;});
  world.children.forEach(m=>{if(m.userData.ground){const op=state.subsurface?.18:1;m.material.opacity=op;m.material.transparent=op<1;m.material.depthWrite=op>.5;}});
  sub.visible=state.subsurface;
  const on=(id,v)=>document.getElementById(id).classList.toggle('on',!!v);
  on('bIso',state.mode==='isolate');on('bFade',state.mode==='fade');on('bInt',state.internals);on('bSub',state.subsurface);
  const bh=document.getElementById('bHid');bh.textContent=state.hidden.size?`${state.hidden.size} hidden · U to unhide`:'';on('bHid',state.hidden.size);
  document.querySelectorAll('#toolbar button').forEach(b=>{const a=b.dataset.act;if(['focus','isolate','fade','hide'].includes(a))b.disabled=!state.selected;b.classList.toggle('active',(a==='isolate'&&state.mode==='isolate')||(a==='fade'&&state.mode==='fade')||(a==='internals'&&state.internals)||(a==='subsurface'&&state.subsurface));});
}
function select(id){state.selected=id;renderTreeSelection();renderChips();renderInspector();applyVisual();document.getElementById('caption').textContent=id?NODES[id].name:'Drilling rig';}
function act(a){switch(a){
  case 'focus':if(state.selected)focusOn(state.selected);break;
  case 'isolate':if(state.selected)state.mode=state.mode==='isolate'?'none':'isolate';break;
  case 'fade':if(state.selected)state.mode=state.mode==='fade'?'none':'fade';break;
  case 'hide':if(state.selected){state.hidden.add(state.selected);const s=state.selected;state.selected=null;renderTreeSelection();renderChips();renderInspector();document.getElementById('caption').textContent='Drilling rig';}break;
  case 'unhide':state.hidden.clear();break;
  case 'internals':state.internals=!state.internals;break;
  case 'subsurface':state.subsurface=!state.subsurface;if(state.subsurface)flyTo(new THREE.Vector3(0,-22,0),cam.theta,1.35,150);else resetView();break;
  case 'reset':state.mode='none';state.hidden.clear();state.internals=false;state.subsurface=false;select(null);resetView();break;
  case 'esc':if(state.mode!=='none')state.mode='none';else if(state.subsurface||state.internals){state.subsurface=false;state.internals=false;resetView();}else select(null);break;
}applyVisual();}

document.getElementById('inspCollapse').onclick=toggleInsp;document.getElementById('inspReveal').onclick=toggleInsp;
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key===' '){spaceDown=true;if(document.activeElement===canvas)e.preventDefault();return;}
  const k=e.key.toLowerCase();const map={f:'focus',i:'isolate',d:'fade',h:'hide',u:'unhide',x:'internals',g:'subsurface',r:'reset',escape:'esc'};
  if(map[k]){if(k==='escape'&&modal.classList.contains('open')){closeModal();return;}act(map[k]);e.preventDefault();return;}
  if(e.key==='['){toggleNav();}else if(e.key===']'){toggleInsp();}else if(e.key==='Tab'){e.preventDefault();app.classList.toggle('full');setTimeout(resize,260);}else if(k==='/'){e.preventDefault();searchEl.focus();}});
window.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false;});

/* ---- boot ---- */
function resize(){const v=document.getElementById('view');const w=v.clientWidth,h=v.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
buildWorld();buildRig();
const total=ORDER.length-SYSTEMS.length;document.getElementById('rigStats').textContent=`${SYSTEMS.length} systems  ·  ${total} components`;
document.getElementById('captionRight').textContent=`${MESHES.length} meshes · ${ORDER.filter(i=>NODE_MESH[i]).length} nodes in 3D`;
renderTree();renderChips();renderInspector();applyVisual();resize();applyCam();
open.add('HS');renderTreeSelection();
let frames=0;(function loop(now){requestAnimationFrame(loop);stepTween(now);renderer.render(scene,camera);if(++frames===3)document.getElementById('loading').classList.add('done');})(performance.now());
</script>
</body>
</html>
